<title>Kalkulator Klaim VMS</title>
<style>
:root{--bg:#F3F5F2;--surface:#fff;--ink:#14201B;--muted:#5A6862;--line:#D3DAD4;--accent:#0E6B53;--accent-soft:#DCEFE7;--bad:#A63A26}
@media (prefers-color-scheme:dark){:root{--bg:#0F1613;--surface:#17211D;--ink:#E4ECE7;--muted:#97A69F;--line:#2B3833;--accent:#4CC49B;--accent-soft:#163A2E;--bad:#EE8B74;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
.eyebrow{font:500 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-size:24px;line-height:1.15}
p{margin:0;color:var(--muted);font-size:14px}
input[type=password]{font:inherit;color:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;padding:10px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
</head>

const KEY = "kkv-key-" + P.salt.slice(0, 12);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u8b64 = a => btoa(String.fromCharCode(...a));
async function derive(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(P.salt), iterations:P.iter}, base, 256));
}
async function decrypt(raw){
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
(async () => {
  if (!window.crypto || !crypto.subtle) { document.getElementById("err").textContent = "Browser ini tidak mendukung dekripsi. Buka lewat https atau pakai Chrome/Edge/Firefox terbaru."; return; }
  let k = null; try { k = localStorage.getItem(KEY); } catch(_) {}
  if (k) { try { show(await decrypt(b64(k))); } catch(_) { try{ localStorage.removeItem(KEY); }catch(_){} } }
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Membuka…"; err.textContent = "";
  try {
    const raw = await derive(document.getElementById("pw").value);
    const html = await decrypt(raw);
    if (document.getElementById("rem").checked) { try{ localStorage.setItem(KEY, u8b64(raw)); }catch(_){} }
    show(html);
  } catch(_) {
    err.textContent = "Password salah. Coba lagi.";
    btn.disabled = false; btn.textContent = "Buka";
  }
});
})();
